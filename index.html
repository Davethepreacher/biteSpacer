<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>BiteSpacer- A simple counter that tracks every bite you take — and helps you lose weight.</title>
  <style>
    /* Layout global */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827; /* bg-gray-900 */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* La "lumière" */
    .light {
      width: 8rem;    /* équivalent w-32 */
      height: 8rem;   /* équivalent h-32 */
      border-radius: 9999px;
      transition: all 0.2s ease;
      background: #450a0a; /* bg-red-950 */
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.7);
    }

    .light.on {
      background: #dc2626; /* bg-red-600 */
      box-shadow: 0 0 60px 20px rgba(220, 38, 38, 0.6);
    }

    /* Bouton */
    button {
      padding: 1rem 2.5rem;  /* px-8 py-4 */
      font-size: 1.125rem;   /* text-lg */
      font-weight: 600;
      border-radius: 0.5rem; /* rounded-lg */
      border: none;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease, color 0.15s ease;
    }

    button.primary {
      background: #2563eb; /* bg-blue-600 */
      color: white;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }

    button.primary:hover {
      background: #1d4ed8; /* bg-blue-700 */
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.5);
    }

    button.primary:active {
      background: #1e40af; /* bg-blue-800 */
      transform: translateY(0);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }

    button.disabled {
      background: #4b5563; /* bg-gray-600 */
      color: #9ca3af;      /* text-gray-400 */
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="light" class="light"></div>

    <button id="toggleButton" class="primary">
      Démarrer
    </button>
  </div>

  <script>
    const lightEl = document.getElementById('light');
    const buttonEl = document.getElementById('toggleButton');

    let isBlinking = false;
    let isLightOn = false;
    let intervalId = null;
    let timeoutId = null;

    function setButtonState(blinking) {
      if (blinking) {
        buttonEl.textContent = 'Clignotement en cours...';
        buttonEl.classList.add('disabled');
        buttonEl.classList.remove('primary');
        buttonEl.disabled = true;
      } else {
        buttonEl.textContent = 'Démarrer';
        buttonEl.classList.remove('disabled');
        buttonEl.classList.add('primary');
        buttonEl.disabled = false;
      }
    }

    function updateLight(on) {
      isLightOn = on;
      if (on) {
        lightEl.classList.add('on');
      } else {
        lightEl.classList.remove('on');
      }
    }

    function startBlinking() {
      if (isBlinking) return;

      isBlinking = true;
      setButtonState(true);
      updateLight(true);

      // Clignote toutes les 500 ms
      intervalId = setInterval(() => {
        updateLight(!isLightOn);
      }, 500);

      // Stop après 10 secondes
      timeoutId = setTimeout(() => {
        clearInterval(intervalId);
        intervalId = null;
        isBlinking = false;
        updateLight(false);
        setButtonState(false);
      }, 15000);
    }

    buttonEl.addEventListener('click', startBlinking);

    // Nettoyage si jamais tu voulais réutiliser ce script dans un contexte plus complexe
    window.addEventListener('beforeunload', () => {
      if (intervalId) clearInterval(intervalId);
      if (timeoutId) clearTimeout(timeoutId);
    });
  </script>
</body>
</html>
